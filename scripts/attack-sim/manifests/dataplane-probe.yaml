# 帶 dataplane 標籤、不帶 component=server 的探針。
# 用來驗證 04-dataplane-egress：即使身分是資料面，也打不出去網際網路。
apiVersion: v1
kind: Pod
metadata:
  name: attack-sim-dataplane-probe
  namespace: aegis
  labels:
    app.kubernetes.io/name: dataplane
    app.kubernetes.io/part-of: aegis-enclave
    aegis.io/role: probe
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  hostNetwork: false
  hostPID: false
  hostIPC: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 100
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: curlimages/curl:8.11.1
      imagePullPolicy: IfNotPresent
      command: ["sleep", "3600"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 100
        allowPrivilegeEscalation: false
        privileged: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir:
        medium: Memory
        sizeLimit: 8Mi
