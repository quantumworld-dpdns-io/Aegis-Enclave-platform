[project]
name = "aegis-dataplane"
version = "0.1.0"
description = "Aegis-Enclave 模組 C：資料安全服務（信封加密、PII 動態遮罩、碳權鏈上互動）"
readme = "README.md"
# 容器內固定 3.12（CONTRACT.md 第 1 節）；上限鎖到 3.13 之前，避免本機用 3.14
# 跑出與正式環境不同的位元組碼與相依解析結果。
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "cryptography>=43",
    "boto3>=1.35",
    "httpx>=0.27",
    "web3>=7.4",
    "prometheus-client>=0.21",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "moto[kms]>=5.0",
    # boto3 本身沒有型別資訊，mypy --strict 需要外掛 stub 才能通過。
    "boto3-stubs[kms]>=1.35",
    "botocore-stubs>=1.35",
]

[tool.uv]
# 這個服務以「應用程式」而非「函式庫」形式部署：不需要打包成 wheel，
# 直接把 app/ 複製進映像即可，省掉一層 build backend 依賴。
package = false

# --------------------------------------------------------------------------
# Ruff：嚴格模式。安全相關規則（S = bandit）對這個處理金鑰與 PII 的模組特別重要。
# --------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "N", "UP", "ANN", "ASYNC", "S", "BLE", "FBT", "B", "A",
    "C4", "DTZ", "T20", "EM", "ISC", "ICN", "LOG", "G", "PIE", "PT", "Q", "RSE",
    "RET", "SLF", "SIM", "TID", "TC", "ARG", "PTH", "ERA", "PL", "TRY", "PERF", "RUF",
]
ignore = [
    # 與 formatter 衝突的規則
    "ISC001",
    # Any 在少數與外部 SDK 交界處無法避免，改由 mypy 控管
    "ANN401",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # 測試就是要 assert
    "S105",    # 測試用假 token
    "S106",
    "PLR2004", # 測試裡的魔術數字是可讀的斷言
    "SLF001",  # 測試允許碰私有成員以驗證 zeroize 等內部行為
    "ARG001",
    "ARG002",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"

# --------------------------------------------------------------------------
# mypy：嚴格模式
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_unimported = true
no_implicit_reexport = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
# web3 / eth_* 系列並未完整提供型別；只在 app/chain 邊界使用，以 Any 隔離。
module = ["web3.*", "eth_typing.*", "eth_account.*", "eth_utils.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
