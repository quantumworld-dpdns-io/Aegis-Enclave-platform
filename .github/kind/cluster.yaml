# Kind 叢集組態（給 CI 的 e2e-kind 使用）
#
# 對齊 docs/CONTRACT.md 第 1 節與 infra/terraform 的預設值：
#   - 叢集名稱 aegis-enclave
#   - 節點映像 kindest/node:v1.31.0（tehcyx/kind provider 落後上游，必須明確 pin）
#   - 關閉預設 CNI，改由 Cilium 1.20.1 接管
#   - 兩個 worker，確保微分段 demo 一定會產生跨節點流量
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: aegis-enclave
networking:
  disableDefaultCNI: true
  kubeProxyMode: iptables
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
nodes:
  - role: control-plane
    image: kindest/node:v1.31.0
  - role: worker
    image: kindest/node:v1.31.0
  - role: worker
    image: kindest/node:v1.31.0
