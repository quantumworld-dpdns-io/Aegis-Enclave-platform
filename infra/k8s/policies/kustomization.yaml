# 讓 `kubectl apply -k infra/k8s/policies` 一次套用。
# 不要用 `kubectl apply -f`：目錄裡的本檔會被當成 Kustomization CR 送進 API 而失敗。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 00-default-deny.yaml
  - 01-dns-egress.yaml
  - 02-gateway-ingress.yaml
  - 03-gateway-to-dataplane-l7.yaml
  - 04-dataplane-egress.yaml
  - 05-metrics-scrape.yaml
  - 06-attacker-isolation.yaml
