# 讓 `kubectl apply -k infra/k8s/policies` 也能一次套用。
# Makefile 走的是 `kubectl apply -f infra/k8s/policies/`，兩種方式等價。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 00-default-deny.yaml
  - 01-dns-egress.yaml
  - 02-gateway-ingress.yaml
  - 03-gateway-to-dataplane-l7.yaml
  - 04-dataplane-egress.yaml
  - 05-metrics-scrape.yaml
  - 06-attacker-isolation.yaml
