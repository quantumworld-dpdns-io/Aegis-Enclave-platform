# 本機 demo 用 Secret 佔位。
#
# 這裡的值都是公開週知的假資料，不是憑證。正式環境必須：
#   1. 用高熵隨機值取代（尤其是 AEGIS_PSEUDONYM_SALT，外洩等於假名可被彩虹表反推）；
#   2. 改由 External Secrets Operator 或 Vault Agent Injector 注入，
#      不要把 Secret 清單提交到版控。
# 本檔會被 kustomization.yaml 套用，目的是讓九個模組平行開發時
# gateway / dataplane / vault 都拿得到「形狀正確」的環境變數，而不是卡在 MissingSecret。
---
apiVersion: v1
kind: Secret
metadata:
  name: aegis-gateway-secrets
  namespace: aegis
  labels:
    app.kubernetes.io/part-of: aegis-enclave
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # gateway 對 JWT sub 做 HMAC-SHA256 的 salt。僅供本機 demo。
  pseudonym-salt: "demo-only-pseudonym-salt-not-a-secret"
---
apiVersion: v1
kind: Secret
metadata:
  name: aegis-dataplane-secrets
  namespace: aegis
  labels:
    app.kubernetes.io/part-of: aegis-enclave
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Vault dev 模式的 root token。僅供本機 demo，正式環境禁止使用 root token。
  vault-token: "aegis-dev-only-root-token"
---
# JWKS 驗簽公鑰示範（預設不建立，避免掛上空金鑰集讓閘道拒掉所有合法 token）。
# 模組 B 產出測試金鑰後，請另外建立 aegis-gateway-jwks：
#
#   kubectl -n aegis create secret generic aegis-gateway-jwks \
#     --from-file=jwks.json=path/to/jwks.json
#
# 對應 gateway.yaml 的 volume `jwks`（optional: true）。
